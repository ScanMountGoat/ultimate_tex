name: Compile Release

on: 
  release:
    types: [created]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - name: Build
      working-directory: ./ultimate_tex
      run: cargo build --release
    - name: Set Icon
      run: |
        curl.exe -sSL "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -o rcedit.exe
        .\rcedit.exe target/release/ultimate_tex.exe --set-icon ultimate_tex/icons/icon.ico
    - name: Create Zip
      run: Compress-Archive -path target/release/ultimate_tex.exe -destinationPath ultimate_tex_win_x64.zip
    - name: Upload Zip
      uses: actions/upload-artifact@v7
      with:
        name: ultimate_tex_win_x64
        path: ultimate_tex_win_x64.zip
    - name: Release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ultimate_tex_win_x64.zip
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin]
        desc: [intel]
        include:
          - target: aarch64-apple-darwin
            desc: apple_silicon
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: ${{matrix.target}}
    - uses: cargo-bins/cargo-binstall@main
    - name: Install cargo-bundle
      run: cargo binstall cargo-bundle --version 0.7.3
    - name: Bundle
      working-directory: ./ultimate_tex
      run: cargo bundle --release --format osx --target ${{matrix.target}}
    - name: Sign Binaries
      run: codesign -s - target/${{matrix.target}}/release/bundle/osx/ultimate_tex.app
    - name: Create Zip
      run: |
        cp -r target/${{matrix.target}}/release/bundle/osx/ultimate_tex.app ultimate_tex.app
        zip -r ultimate_tex_macos_${{matrix.desc}}.zip ultimate_tex.app
    - name: Upload Zip
      uses: actions/upload-artifact@v7
      with:
        name: ultimate_tex_macos_${{matrix.desc}}
        path: ultimate_tex_macos_${{matrix.desc}}.zip
    - name: Release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ultimate_tex_macos_${{matrix.desc}}.zip
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  build-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6
    - uses: cargo-bins/cargo-binstall@main
    - name: Install cargo-bundle
      run: cargo binstall cargo-bundle --version 0.7.3
    - name: Bundle
      working-directory: ./ultimate_tex
      run: cargo bundle --release --format appimage --target ${{matrix.target}}
    - name: Create Zip
      run: zip -j ultimate_tex_linux_x64.zip target/release/bundle/linux/ultimate_tex.appimage
    - name: Upload Zip
      uses: actions/upload-artifact@v7
      with:
        name: ultimate_tex_linux_x64
        path: ultimate_tex_linux_x64.zip
    - name: Release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ultimate_tex_linux_x64.zip
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
